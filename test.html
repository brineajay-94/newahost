<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Newa Host | Discord</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: #111214;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    color: #dbdee1;
}

/* Discord-style invite card */
.invite-card {
    width: 432px;
    max-width: 100%;
    background: #2b2d31;
    border-radius: 8px;
    overflow: hidden;
    box-shadow:
        0 8px 24px rgba(0,0,0,.45),
        0 2px 6px rgba(0,0,0,.25);
}

/* Banner */
.banner {
    width: 100%;
    height: 120px;
    position: relative;
    overflow: hidden;
    background: #1e1f22;
}

.banner img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

/* Content */
.content {
    position: relative;
    padding: 52px 16px 16px;
}

/* Server icon */
.server-icon {
    position: absolute;
    top: -36px;
    left: 16px;

    width: 72px;
    height: 72px;

    border-radius: 50%;
    border: 6px solid #2b2d31;

    background: #111214;
    overflow: hidden;

    box-shadow: 0 2px 5px rgba(0,0,0,.3);
}

.server-icon img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

/* Server name */
.server-name {
    font-size: 20px;
    font-weight: 700;
    color: #f2f3f5;
    margin-bottom: 4px;
}

/* Description */
.description {
    font-size: 14px;
    line-height: 20px;
    color: #b5bac1;
    margin-bottom: 16px;
}

/* Status */
.status {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: #b5bac1;
    margin-bottom: 16px;
}

.status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #23a559;
}

/* Join button */
.join-btn {
    width: 100%;
    height: 44px;

    border: none;
    border-radius: 3px;

    background: #5865f2;
    color: white;

    font-size: 15px;
    font-weight: 600;

    cursor: pointer;

    transition:
        background .15s ease,
        transform .15s ease;
}

.join-btn:hover {
    background: #4752c4;
}

.join-btn:active {
    transform: scale(.985);
}

/* Mobile */
@media (max-width: 480px) {
    body {
        padding: 14px;
    }

    .invite-card {
        width: 100%;
    }

    .banner {
        height: 105px;
    }

    .content {
        padding-top: 50px;
    }
}
</style>
</head>

<body>

<div class="invite-card">

    <!-- Discord Banner -->
    <div class="banner">
        <img
            src="https://i.ibb.co/bgWbMF8W/file-00000000d16481fab2bebfab65e90653.png"
            alt="Newa Host Discord Banner"
        >
    </div>

    <div class="content">

        <!-- Discord Server Icon -->
        <div class="server-icon">
            <img
                src="https://i.ibb.co/01CV9DR/Chat-GPT-Image-Sep-4-2026-02-11-37-PM.png"
                alt="Newa Host"
            >
        </div>

        <!-- Server Information -->
        <div class="server-name">
            Newa Host
        </div>

        <div class="description">
            Nepal's hosting community. Minecraft hosting,
            VPS, servers and more.
        </div>

        <div class="status">
            <span class="status-dot"></span>
            Join the Newa Host community
        </div>

        <!-- Join Discord -->
        <button
            class="join-btn"
            onclick="window.open('https://discord.gg/RfF5Umpwpw', '_blank')"
        >
            Join Server
        </button>

    </div>

</div>

</body>
</html>
